name: Deploy Jupyter to EKS

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.github/**'
      - '.gitignore'
      - '**/MERGE*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: Build Jupyter Docker image
      - name: Build Jupyter image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/jupyter_app:${{ github.sha }} ./question_2_jupyter_pandas

      # Step 4: Push Jupyter Docker image
      - name: Push Jupyter image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/jupyter_app:${{ github.sha }}

      # Step 5: Configure AWS credentials using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-oidc-deploy-role
          role-session-name: github-actions
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 6: Update kubeconfig for EKS
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}

      # Step 7: Deploy updated image to EKS
      - name: Deploy Jupyter to EKS
        run: |
          kubectl set image deployment/jupyter-app jupyter-app=${{ secrets.DOCKERHUB_USERNAME }}/jupyter_app:${{ github.sha }}
          kubectl rollout status deployment/jupyter-app