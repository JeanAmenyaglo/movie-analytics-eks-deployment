name: Deploy Flask to EKS

on:
  push:
    branches:
      - main
    paths:
      - "question_1_flask/**"
      - ".github/workflows/deploy-flask.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Flask image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/flask_app:${{ github.sha }} ./question_1_flask

      - name: Push Flask image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/flask_app:${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Deploy Flask to EKS
        run: |
          kubectl set image deployment/flask-app flask-app=${{ secrets.DOCKERHUB_USERNAME }}/flask_app:${{ github.sha }}
          kubectl rollout status deployment/flask-app