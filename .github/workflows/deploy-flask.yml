name: Deploy Flask to EKS

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.github/**'
      - '.gitignore'
      - '**/MERGE*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: Build Flask Docker image
      - name: Build Flask image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/flask_app:${{ github.sha }} ./question_1_flask

      # Step 4: Push Flask Docker image
      - name: Push Flask image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/flask_app:${{ github.sha }}

      # Step 5: Configure AWS credentials using NEW OIDC ROLE
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::408433988572:role/github-oidc-eks-runtime-role
          role-session-name: github-actions
          aws-region: ca-central-1

      # Step 6: Verify AWS identity (CRITICAL TEST)
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # Step 7: Update kubeconfig for EKS
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}

      # Step 8: Deploy updated image to EKS
      - name: Deploy Flask to EKS
        run: |
          kubectl set image deployment/flask-app flask-app=${{ secrets.DOCKERHUB_USERNAME }}/flask_app:${{ github.sha }}
          kubectl rollout status deployment/flask-app