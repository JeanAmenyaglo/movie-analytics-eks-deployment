apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter-app
  labels:
    app: jupyter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter
  template:
    metadata:
      labels:
        app: jupyter
    spec:
      containers:
        - name: jupyter-app
          image: jeankoku/jupyter_app:v1
          ports:
            - containerPort: 8888
          args:
            - "jupyter"
            - "lab"
            - "--ip=0.0.0.0"
            - "--no-browser"
            - "--allow-root"
            - "--NotebookApp.token=''"
            - "--NotebookApp.password=''"
          resources:
            limits:
              memory: "512Mi"
              cpu: "1000m"
            requests:
              memory: "256Mi"
              cpu: "500m"